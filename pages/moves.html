<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Supa Smackdown · moves</title>
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2a2622; --paper: #f2ede2; --muted: #857a6a; --line: #d8cfbd; --box: #e0523a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; background: #e9e2d3; color: var(--ink); font: 14px/1.4 ui-monospace, Menlo, monospace; }
  nav { width: 230px; flex: none; overflow-y: auto; padding: 16px 12px 40px; border-right: 1.5px solid var(--line); background: var(--paper); }
  nav h2 { font: 700 24px Caveat, cursive; margin: 14px 6px 2px; }
  .who { position: relative; }
  .who button, .who li { display: flex; align-items: center; gap: 10px; width: 100%; font: 700 24px Caveat, cursive; color: inherit; cursor: pointer; }
  #who { padding: 4px 10px 4px 6px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); }
  #who::after { content: '▾'; margin-left: auto; font: 14px ui-monospace, Menlo, monospace; transition: transform .15s; }
  #who[aria-expanded="true"]::after { transform: rotate(180deg); }
  .who ul { position: absolute; z-index: 2; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px; list-style: none; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); box-shadow: 0 6px 20px rgba(60,45,25,.18); }
  .who li { padding: 2px 8px 2px 4px; border-radius: 3px; }
  .who li:hover, .who li.hi { background: #e9e2d3; }
  .who li[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .who li[aria-selected="true"] canvas { background: var(--paper); }
  .who canvas { width: 44px; height: 34px; flex: none; border-radius: 3px; }
  #nav button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 4px 8px; border: 0; border-radius: 4px; background: none; font: inherit; color: inherit; cursor: pointer; }
  #nav button:hover { background: #e9e2d3; }
  #nav button[aria-current] { background: var(--ink); color: var(--paper); }
  #nav button::before { content: ''; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
  #nav button.done::before { background: var(--box); border-color: var(--box); }
  main { flex: 1; min-width: 0; overflow-y: auto; padding: 24px 32px; }
  h1 { font: 700 40px Caveat, cursive; margin: 0; }
  .sub { color: var(--muted); margin-bottom: 14px; }
  canvas { display: block; width: 100%; max-width: 960px; aspect-ratio: 16 / 9; border-radius: 4px; box-shadow: 0 1px 0 var(--line), 0 6px 24px rgba(60,45,25,.12); }
  .bar { display: flex; height: 22px; max-width: 960px; margin-top: 14px; position: relative; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
  .bar div { display: grid; place-items: center; font-size: 11px; white-space: nowrap; overflow: hidden; }
  .bar .startup { background: #e8d9a8; } .bar .active { background: var(--box); color: #fff; } .bar .endlag { background: #b9c4cf; } .bar .none { background: var(--line); color: var(--muted); }
  .bar .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 20px; }
  .controls button, .controls select { font: inherit; padding: 4px 10px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); color: inherit; cursor: pointer; }
  .controls span { color: var(--muted); margin-left: 6px; }
  .controls label { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); cursor: pointer; }
  .sw { width: 10px; height: 10px; border: 1.5px solid; margin-left: 4px; } .sw.hurt { border-color: #c9a227; background: #f0dc9a; } .sw.hit { border-color: var(--box); background: #f3b9ab; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 20px; margin: 0; max-width: 960px; }
  dt { color: var(--muted); } dd { margin: 0; } .empty { color: var(--muted); }
  #boardwrap h2 { font: 700 26px Caveat, cursive; margin: 0 0 6px; }
  #board { aspect-ratio: 960 / 260; cursor: pointer; margin-bottom: 22px; }
  /* learn mode (the default): a lesson card per move, chapter by chapter, with a training bag to hit · advanced = the storybook breakdown */
  body.learn .adv, body:not(.learn) .lrn { display: none !important; }
  #exit { position: sticky; top: 0; z-index: 3; display: inline-block; margin: 0 0 12px; padding: 3px 12px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: 0 0 0 10px var(--paper); color: inherit; text-decoration: none; white-space: nowrap; }
  #exit:hover { background: var(--ink); color: var(--paper); }
  #mode { display: flex; margin-top: 10px; border: 1.5px solid var(--ink); border-radius: 4px; overflow: hidden; }
  #mode button { flex: 1; padding: 4px 0; border: 0; background: var(--paper); font: inherit; color: inherit; cursor: pointer; }
  #mode button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  body.learn { flex-direction: column; }
  body.learn nav { width: auto; display: flex; align-items: center; gap: 16px; padding: 10px 24px; overflow: visible; border: 0; border-bottom: 1.5px solid var(--line); }
  body.learn #nav { display: none; } body.learn .who { width: 250px; } body.learn #mode { width: 220px; margin: 0 0 0 auto; } body.learn #exit { margin: 0; }
  body.learn main { padding: 22px 24px 40px; }
  #lesson { max-width: 860px; margin: 0 auto; }
  #chapters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  #chapters button { font: 700 19px Caveat, cursive; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
  #chapters button.done { border-color: var(--ink); color: var(--ink); }
  #chapters button[aria-current] { border-color: var(--box); background: var(--box); color: #fff; }
  .card { padding: 20px 24px 22px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); box-shadow: 5px 6px 0 var(--ink); }
  .card header { display: flex; align-items: center; gap: 16px; }
  #stepno { flex: none; display: grid; place-items: center; width: 58px; height: 58px; border-radius: 50%; background: var(--ink); color: var(--paper); font: 700 22px Caveat, cursive; }
  #lname { margin: 0; font: 700 40px/1 Caveat, cursive; }
  #intro { margin: 4px 0 0; color: var(--muted); }
  .press { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin: 16px 0 14px; padding: 10px 14px; border: 1.5px dashed var(--muted); border-radius: 8px; font-size: 16px; }
  .press b { font: 700 22px Caveat, cursive; color: var(--box); }
  kbd { display: inline-block; min-width: 1.7em; padding: 1px 7px; border: 1.5px solid var(--ink); border-bottom-width: 3px; border-radius: 4px; background: #fff; font: 700 15px ui-monospace, Menlo, monospace; text-align: center; }
  #stage { position: relative; } #stage canvas { max-width: none; border: 1.5px solid var(--line); box-shadow: none; }
  #slow { position: absolute; top: 10px; right: 10px; padding: 2px 10px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); font: inherit; font-size: 12px; color: inherit; cursor: pointer; }
  #stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; } #stats:empty { display: none; }
  #stats div { padding: 8px 12px; border-radius: 8px; background: #e9e2d3; } #stats b { display: block; font: 700 24px/1.1 Caveat, cursive; } #stats small { color: var(--muted); }
  .steps { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
  .steps button { font: 700 22px Caveat, cursive; padding: 2px 18px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); color: inherit; cursor: pointer; }
  .steps button:disabled { opacity: .35; cursor: default; } .steps #fwd { background: var(--ink); color: var(--paper); }
  #dots { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  #dots button { width: 12px; height: 12px; padding: 0; border: 1.5px solid var(--ink); border-radius: 50%; background: none; cursor: pointer; }
  #dots button.done { background: var(--line); } #dots button[aria-current] { border-color: var(--box); background: var(--box); transform: scale(1.35); }
  .keys { margin: 18px 0 0; text-align: center; font-size: 12px; color: var(--muted); } .keys kbd { font-size: 11px; }
</style>
</head>
<body>
<nav><a id="exit" href="../index.html" title="Esc">← back to game</a><div class="who"><button id="who" aria-haspopup="listbox" aria-expanded="false" aria-label="character"></button><ul id="whoList" role="listbox" hidden></ul></div>
<div id="mode"><button id="learnBtn">learn</button><button id="storyBtn">advanced</button></div><div id="nav"></div></nav>
<main>
  <section id="lesson" class="lrn">
    <div id="chapters"></div>
    <article class="card">
      <header><span id="stepno"></span><div><h2 id="lname"></h2><p id="intro"></p></div></header>
      <div class="press"><b>how</b><span id="how"></span></div>
      <div id="stage"><button id="slow">slow-mo</button></div>
      <div id="stats"></div>
    </article>
    <div class="steps"><button id="back">← back</button><div id="dots"></div><button id="fwd">next →</button></div>
    <p class="keys"><kbd>←</kbd> <kbd>→</kbd> back / next · <kbd>Space</kbd> pause · <kbd>Esc</kbd> back to game · in game: arrows + <kbd>C</kbd> light <kbd>X</kbd> heavy <kbd>V</kbd> special <kbd>G</kbd> grab, or WASD + <kbd>J</kbd> <kbd>K</kbd> <kbd>L</kbd> <kbd>I</kbd> · dodge <kbd>Shift</kbd> / <kbd>Z</kbd></p>
  </section>
  <h1 id="name" class="adv"></h1>
  <div class="sub adv" id="sub"></div>
  <div id="slot" class="adv"><canvas id="c"></canvas></div>
  <div class="bar adv" id="bar"></div>
  <div class="controls adv">
    <button id="play">pause</button>
    <button id="prev" aria-label="previous frame">◀</button>
    <button id="next" aria-label="next frame">▶</button>
    <select id="speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option></select>
    <span id="frame"></span>
    <label><input type="checkbox" id="boxes"> boxes <i class="sw hurt"></i>hurt <i class="sw hit"></i>hit</label>
    <span>↑↓ move · space play/pause · ←→ step · H boxes · Esc back to game</span>
  </div>
  <section id="boardwrap" class="adv"><h2>Storyboard</h2><canvas id="board" title="click a panel to jump to that frame"></canvas></section>
  <dl id="data" class="adv"></dl>
</main>
<script src="../src/sketch.js"></script>
<script src="../src/characters/clawd.js"></script>
<script src="../src/characters/clawd-moveset.js"></script>
<script src="../src/characters/grok.js"></script>
<script src="../src/characters/grok-moveset.js"></script>
<script src="../src/characters/wumpus.js"></script>
<script src="../src/characters/wumpus-moveset.js"></script>
<script src="../src/characters/android.js"></script>
<script src="../src/characters/android-moveset.js"></script>
<script src="../src/characters/duo.js"></script>
<script src="../src/characters/duo-moveset.js"></script>
<script src="../src/characters/snoo.js"></script>
<script src="../src/characters/snoo-moveset.js"></script>
<script src="../src/characters/lego.js"></script>
<script src="../src/characters/lego-moveset.js"></script>
<script src="../src/characters/muse.js"></script>
<script src="../src/characters/muse-moveset.js"></script>
<script src="../src/characters/snoopy.js"></script>
<script src="../src/characters/snoopy-moveset.js"></script>
<script>
const VW = 480, VH = 270, SCALE = 2, GROUND = 200;
const cv = document.getElementById('c'); ctx = cv.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = VW * SCALE * dpr; cv.height = VH * SCALE * dpr;
const paper = makePaper(VW, VH, dpr * SCALE);
const $ = id => document.getElementById(id);
const BW = 960, COLS = 6, PW = BW / COLS, PH = 130; // storyboard: up to 12 panels in 2 rows
const board = $('board'), bctx = board.getContext('2d');
board.width = BW * dpr; board.height = PH * 2 * dpr;
const boardPaper = makePaper(BW, PH * 2, dpr);
const title = k => k.replace(/([A-Z]|\d+)/g, ' $1').replace(/^./, c => c.toUpperCase());
const moveName = (key, m) => m.name ?? title(key); // a fighter's own move goes by its own name (Muse's forward smash: Llama Kick)

// every fighter: how to draw it, and its moveset. The others move like Claw'd (their draw functions take his pose fields; Grok
// bounces instead of walking and Duo flies: grok-moveset.js, duo-moveset.js), and get the rest of his move list, all still to do
const todo = Object.fromEntries(Object.entries(MOVESET).map(([g, moves]) => [g, Object.fromEntries(Object.keys(moves).map(k => [k, {}]))]));
const basic = { ...todo, movement: MOVESET.movement };
const withTodo = set => ({ ...todo, ...Object.fromEntries(Object.entries(set).map(([g, m]) => [g, { ...todo[g], ...m }])) }); // a fighter's moves, the rest still to do
const FIGHTERS = {
  clawd: { name: "Claw'd", moves: MOVESET, draw: drawClawd, fx: drawClawdFx, hurt: clawdHurtbox },
  grok: { name: 'Grok Bot', moves: withTodo(GROK_MOVESET), draw: drawGrok, fx: drawClawdFx, hurt: grokHurtbox },
  wumpus: { name: 'Wumpus', moves: withTodo(WUMPUS_MOVESET), draw: drawWumpus, fx: drawClawdFx },
  android: { name: 'Android', moves: withTodo(ANDROID_MOVESET), draw: drawAndroid, fx: drawClawdFx, hurt: androidHurtbox },
  duo: { name: 'Duo', moves: withTodo(DUO_MOVESET), draw: drawDuo, fx: drawClawdFx },
  snoo: { name: 'Snoo', moves: withTodo(SNOO_MOVESET), draw: drawSnoo, fx: (x, y, p) => { drawClawdFx(x, y, p); if (p.oops > 0) drawOops(x, y - 100, p.oops, p.oopsMsg); }, // + its shield break toast
    hurt: (p = {}) => { const w = 46 * (p.sx ?? 1), h = 76 * (p.sy ?? 1); return { x: (p.x || 0) - w / 2, y: (p.y || 0) - h, w, h }; } },
  muse: { name: 'Muse', moves: withTodo(MUSE_MOVESET), draw: drawMuse, fx: (x, y, p) => { drawClawdFx(x, y, p); if (p.oops > 0) drawOops(x, y - 100, p.oops, p.oopsMsg); }, // + its shield break toast
    hurt: (p = {}) => { const w = 50 * (p.sx ?? 1), h = 70 * (p.sy ?? 1); return { x: (p.x || 0) - w / 2, y: (p.y || 0) - h, w, h }; } },
  snoopy: { name: 'Snoopy', moves: withTodo(SNOOPY_MOVESET), draw: drawSnoopy, fx: (x, y, p) => { drawClawdFx(x, y, p); if (p.oops > 0) drawOops(x, y - 100, p.oops, p.oopsMsg); }, // + his shield break toast
    hurt: (p = {}) => { const w = 46 * (p.sx ?? 1), h = 78 * (p.sy ?? 1); return { x: (p.x || 0) - w / 2, y: (p.y || 0) - h, w, h }; } },
  lego: { name: 'Lego Man', moves: withTodo(LEGO_MOVESET), draw: drawLego, fx: drawClawdFx, hurt: (p = {}) => ({ x: (p.x || 0) - 22 * (p.sx ?? 1), y: (p.y || 0) - 72 * (p.sy ?? 1), w: 44 * (p.sx ?? 1), h: 72 * (p.sy ?? 1) }) },
};
for (const F of Object.values(FIGHTERS)) if (F.draw !== drawClawd) { // as in the game: the others drawn inside Claw'd's effects (captions, speed lines…)
  const art = F.draw; F.draw = (x, y, p, face) => drawClawd(x, y, { ...p, body: () => art(x, y, p, face) }, face);
}

// character picker: a button showing the fighter, opening a list of them all, each with a little portrait
const IDS = Object.keys(FIGHTERS);
function portrait(id) {
  const c = document.createElement('canvas'); c.width = 44 * dpr; c.height = 34 * dpr;
  const main = ctx; ctx = c.getContext('2d'); seed = 3;
  ctx.setTransform(dpr * 0.42, 0, 0, dpr * 0.42, 22 * dpr, 31 * dpr); FIGHTERS[id].draw(0, 0, {});
  ctx = main; return c;
}
for (const id of IDS) {
  const li = document.createElement('li'); li.id = 'who-' + id; li.setAttribute('role', 'option');
  li.append(portrait(id), FIGHTERS[id].name);
  li.onclick = () => choose(id);
  $('whoList').append(li);
}
let hi = 0; // the option highlighted while the list is open
function openList(on) {
  $('whoList').hidden = !on; $('who').setAttribute('aria-expanded', on);
  if (on) { hi = IDS.indexOf(fid); highlight(); }
}
function highlight() { IDS.forEach((id, i) => $('who-' + id).classList.toggle('hi', i === hi)); }
function choose(id) { openList(false); $('who').blur(); if (id !== fid) { pick(id); select(0); } } // blur: keep ↑↓ for the move list
$('who').onclick = () => openList($('whoList').hidden);
addEventListener('mousedown', e => { if (!e.target.closest('.who')) openList(false); });

// learn mode (the default; ?storybook = advanced): the fighter's moves as lessons, in this order, one chapter per group. A group not
// listed goes last under its own name; moves with no animation yet, or nothing to press (idle, falling), are left out
const CHAPTERS = {
  movement: ['Getting around', 'Walk, run and jump. Everything else starts from here.'],
  groundAttacks: ['Light attacks', 'Quick hits on the ground: tap light, and hold a direction for a different one.'],
  aerials: ['Air attacks', 'Light in the air. The direction you hold picks which one comes out.'],
  smashAttacks: ['Heavy attacks', 'Slow but strong. Hold heavy to charge. These are what KO.'],
  specials: ['Specials', 'The moves only this fighter has.'],
  defense: ['Defense', 'Shield, dodge and roll out of trouble.'],
  grabs: ['Grabs & throws', "A grab goes right through a shield. Then pummel, or throw them where you want."],
  ledge: ['Ledges', 'Knocked off the stage? Catch the edge and get back on safely.'],
  reactions: ['Getting hit', 'What happens when you take a hit, and how to get back up.'],
};
const ORDER = Object.keys(CHAPTERS), rank = g => ORDER.includes(g) ? ORDER.indexOf(g) : ORDER.length;
let learn = !location.search.includes('storybook'), seen = new Set(); // seen = fighter/move lessons opened, ticked off in the list
// the move's input with its buttons as keycaps (the arrow-key set; the hint under the controls gives the WASD one)
const KEYS = { light: 'C', heavy: 'X', special: 'V', B: 'V', grab: 'G', dodge: 'Shift', shield: 'Shift', jump: 'Space', up: '↑', down: '↓', forward: '→', back: '←', 'left/right': '← →' };
const how = s => s.replace(/ \((X \/ K|V \/ L|Shift \/ Z|G \/ I)\)/g, '')
  .replace(/\b(left\/right|light|heavy|special|B|grab|dodge|shield|jump|up|down|forward|back)\b(?! runs| connects)|[←→↑↓]/g, k => `<kbd>${KEYS[k] || k}</kbd>`);
// plain-words frame data as [big value, label] tiles: how fast, how much, which way it sends them
const LAUNCH = ['→ forward', '↗ up and forward', '↑ straight up', '↖ up and behind', '← behind you', '↙ down and behind', '↓ straight down', '↘ down and forward'];
function facts(m) {
  const out = [];
  if (Number.isFinite(m.startup)) out.push([m.startup <= 5 ? 'fast' : m.startup <= 10 ? 'medium' : 'slow', `speed · hits on frame ${m.startup + 1}`]);
  if (typeof m.damage === 'number') out.push([`${m.damage}%`, 'damage']);
  if (Number.isFinite(m.kb?.angle)) out.push([LAUNCH[Math.round((m.kb.angle % 360 + 360) % 360 / 45) % 8], 'sends them']);
  if (Array.isArray(m.intangible)) out.push([`frames ${m.intangible[0] + 1}–${m.intangible[1]}`, "can't be hit"]);
  if (m.grab) out.push(['beats shields', 'grab']);
  return out;
}

// flatten the fighter's moveset into one list for ↑↓ browsing
let F, fid, list = [];
function pick(id) {
  F = FIGHTERS[id]; fid = id; list = []; $('nav').replaceChildren();
  $('who').replaceChildren(portrait(id), F.name);
  IDS.forEach(i => $('who-' + i).setAttribute('aria-selected', i === id));
  const groups = Object.entries(F.moves);
  if (learn) groups.sort(([a], [b]) => rank(a) - rank(b));
  for (const [group, moves] of groups) {
    const keep = Object.entries(moves).filter(([, m]) => !learn || ((m.anim || m.preview) && m.input && m.input !== 'none'));
    if (!keep.length) continue;
    const h = document.createElement('h2'); h.textContent = learn ? CHAPTERS[group]?.[0] ?? title(group) : title(group); $('nav').append(h);
    for (const [key, m] of keep) {
      const move = m.preview ? { ...m, anim: m.preview } : m; // a move the game plays in parts (Grok's Starship) previews as one run
      const b = document.createElement('button');
      b.textContent = moveName(key, m);
      if (learn ? seen.has(id + '/' + key) : move.anim) b.classList.add('done');
      const item = { group, key, move, el: b };
      b.onclick = () => select(list.indexOf(item));
      list.push(item); $('nav').append(b);
    }
  }
  if (learn) $('chapters').replaceChildren(...[...new Set(list.map(it => it.group))].map(g => {
    const b = document.createElement('button'); b.dataset.g = g; b.textContent = CHAPTERS[g]?.[0] ?? title(g);
    b.onclick = () => select(list.findIndex(it => it.group === g)); return b;
  }));
}

let cur = 0, f = 0, playing = true, phases = [], total = 60, hold = 0, bag = null; // hold = frames the loop rests on the last pose (learn: the bag's flight)

function select(i) {
  cur = (i + list.length) % list.length; f = 0;
  const { group, key, move, el } = list[cur];
  list.forEach(it => it.el.toggleAttribute('aria-current', it === list[cur]));
  if (!learn) el.scrollIntoView({ block: 'nearest' });
  history.replaceState(null, '', `${learn ? location.pathname : '?storybook'}#${fid}/${key}`);
  $('name').textContent = moveName(key, move);
  $('sub').textContent = `${F.name} · ${title(group)}${move.name ? ' · ' + title(key) : ''}${move.input ? ' · ' + move.input : ''}`;
  const { startup, active, endlag } = move;
  phases = !move.previewFrames && [startup, active, endlag].every(Number.isFinite)
    ? [['startup', startup], ['active', active], ['endlag', endlag]]
    : [];
  total = phases.length ? startup + active + endlag : move.previewFrames || move.frames || 60;
  $('bar').innerHTML = (phases.length
    ? phases.map(([n, v]) => `<div class="${n}" style="flex:${v}">${n} ${v}f</div>`).join('')
    : `<div class="none" style="flex:1">no frame data · looping ${total}f</div>`) + '<div class="head" id="head"></div>';
  $('boardwrap').hidden = !move.anim;

  const show = v => Array.isArray(v) || typeof v !== 'object' || v == null ? v ?? '—' : Object.entries(v).map(([a, b]) => `${a}: ${typeof b === 'function' ? 'ƒ' : typeof b === 'object' && !Array.isArray(b) && b ? `(${show(b)})` : b ?? '—'}`).join(' · '); // nested data in brackets
  $('data').innerHTML = Object.entries(move).filter(([k]) => k !== 'input').map(([k, v]) =>
    `<dt>${k}</dt><dd>${v == null ? '<span class="empty">—</span>' : typeof v === 'function' ? (k === 'anim' ? 'ƒ animation' : 'ƒ changes over the move') : typeof v === 'object' ? show(v) : v}</dd>`).join('');

  bag = null; hold = 0;
  if (!learn) return;
  seen.add(fid + '/' + key); el.classList.add('done');
  const mine = list.filter(it => it.group === group), done = it => seen.has(fid + '/' + it.key);
  $('stepno').textContent = `${mine.indexOf(list[cur]) + 1}/${mine.length}`;
  $('lname').textContent = moveName(key, move);
  $('intro').textContent = CHAPTERS[group]?.[1] ?? '';
  $('how').innerHTML = how(move.input);
  $('stats').innerHTML = facts(move).map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join('');
  $('dots').replaceChildren(...mine.map(it => {
    const d = document.createElement('button'); d.title = moveName(it.key, it.move); d.classList.toggle('done', done(it)); d.toggleAttribute('aria-current', it === list[cur]);
    d.onclick = () => select(list.indexOf(it)); return d;
  }));
  for (const b of $('chapters').children) { b.toggleAttribute('aria-current', b.dataset.g === group); b.classList.toggle('done', list.every(it => it.group !== b.dataset.g || done(it))); }
  $('back').disabled = cur === 0;
  $('fwd').textContent = cur === list.length - 1 ? 'start over ↺' : 'next →';
  playing = true; $('play').textContent = 'pause';

  // an attack gets the training bag, standing where its hitbox (or the thing it throws) lands; grabs already carry theirs
  if (group === 'grabs' || !Number.isFinite(startup)) return;
  const p = move.anim(startup, total) || {}, ay = (p.y || 0) + (p.air || 0);
  const pr = move.projectile && { ...move.projectile, ...move.projectile.pick?.[0] }, hb = typeof move.hitbox === 'function' ? move.hitbox(startup) : move.hitbox;
  if (pr?.speed > 0) { const x = pr.x + Math.min(120, pr.speed * (active + endlag) / 60 * 0.8); bag = { x: x + 22, y: Math.min(0, ay + pr.y + 38), at: startup + (x - pr.x) / pr.speed * 60 }; }
  else if (hb) { const cx = (p.x || 0) + hb.x + hb.w / 2, side = Math.sign(cx) || 1; bag = { x: side * Math.max(Math.abs(cx), (halfBox() || 28) + 22), y: Math.min(0, ay + hb.y + hb.h / 2 + 38), at: startup }; }
  if (!bag) return;
  const a = (move.kb?.angle ?? 0) * Math.PI / 180, D = move.kb ? 30 + move.kb.base * 0.6 + move.kb.growth * 0.7 : 0; // how far it flies: the knockback, roughly
  Object.assign(bag, { dx: Math.cos(a) * D, dy: -Math.sin(a) * D, dmg: typeof move.damage === 'number' ? move.damage : 0 });
  hold = 50;
}

// the bag at frame fr: still until the hit, then a shudder, a flight along the launch angle, and a drop back to the floor
function bagAt(fr) {
  const s = (fr - bag.at) / 60;
  if (s < 0) return { x: bag.x, y: bag.y, rot: 0, s };
  const e = 1 - (1 - Math.min(1, Math.max(0, s - 0.08) / 0.35)) ** 2, drop = Math.max(0, s - 0.45), y = Math.min(0, bag.y + bag.dy * e + 900 * drop * drop);
  return { x: bag.x + bag.dx * e + (s < 0.08 ? Math.sin(fr * 3) * 3 : 0), y, rot: y < 0 ? Math.sign(bag.dx) * 0.6 * e : 0, s };
}
function drawBag(fr) {
  const b = bagAt(fr), sh = Math.max(0.35, 1 + b.y / 160);
  ctx.fillStyle = 'rgba(42,38,34,0.12)'; ctx.beginPath(); ctx.ellipse(b.x, 0, 26 * sh, 4 * sh, 0, 0, 6.28); ctx.fill();
  drawSack(b.x, b.y, b.rot);
}
function drawPow(fr) { // on top of everything: a burst where it connected, and the damage floating up
  const { s } = bagAt(fr);
  if (s < 0 || s > 0.7) return;
  const cx = bag.x - Math.sign(bag.x) * 18, cy = bag.y - 40, k = Math.min(1, s / 0.1);
  ctx.save(); ctx.globalAlpha = 1 - s / 0.7; ctx.strokeStyle = BOX; ctx.lineWidth = 3;
  if (s < 0.25) for (let i = 0; i < 8; i++) { const t = i / 8 * 6.283 + 0.2; line(cx + Math.cos(t) * 10 * k, cy + Math.sin(t) * 10 * k, cx + Math.cos(t) * 28 * k, cy + Math.sin(t) * 28 * k, 1, 1); }
  if (bag.dmg) { ctx.fillStyle = INK; ctx.font = '700 26px Caveat, cursive'; ctx.textAlign = 'center'; ctx.fillText(`+${bag.dmg}%`, bag.x, bag.y - 92 - s * 40); }
  ctx.restore();
}

const phaseAt = fr => { let end = 0; for (const [n, v] of phases) if (fr < (end += v)) return n; return null; };
const panelFrames = () => Array.from({ length: Math.min(12, total) }, (_, i) => Math.floor(i * total / Math.min(12, total)));

const halfBox = () => F.hurt ? F.hurt().w / 2 : 0;
function drawRect(b, stroke, fill) {
  ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.fillStyle = fill;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  poly([[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]], 1);
}

// shadow and the fighter, plus hurtbox / active hitbox when boxes are on, with the floor at y = 0
function drawFigure(fr) {
  const { move } = list[cur];
  const pose = move.anim ? move.anim(fr, total) || {} : {};
  const air = pose.air || 0, x = pose.x || 0, y = (pose.y || 0) + air;
  if (air <= 0) { // shadow shrinks the higher Claw'd goes; gone once it drops below the floor
    const s = Math.max(0.35, 1 + air / 160);
    ctx.fillStyle = 'rgba(42,38,34,0.12)';
    ctx.beginPath(); ctx.ellipse(x, 0, 44 * s, 4 * s, 0, 0, 6.28); ctx.fill();
  }
  if (F.fx) F.fx(0, 0, pose);
  if (pose.carry) drawSack(pose.carry[0], air + pose.carry[1], pose.carry[2]); // grabbed bag, behind the claws
  if (move.step) { const S = move.step, n = Math.floor(Math.max(0, fr - move.startup) / S.every), dx = move.drive * S.every / 60; for (let k = 1; k <= Math.min(n, move.active / S.every); k++) drawLegoPlate({ x: 6 - S.w / 2 - (n - k) * dx, y: move.anim(move.startup + k * S.every).air, w: S.w, h: S.h, col: k % 4 }); } // the staircase so far
  F.draw(0, air, pose);
  const pr = move.projectile && { ...move.projectile, ...move.projectile.pick?.[0] }, st = (fr - move.startup) / 60; // thrown thing (a picked one: the first), flying from the release frame
  const wy = pr?.wave ? pr.wave[0] * Math.sin(2 * Math.PI * st / pr.wave[1]) : 0; // a projectile that bobs as it flies
  if (pr && st >= 0 && !(bag && fr >= bag.at)) move.shotArt ? move.shotArt(pr.x + pr.speed * st, air + pr.y, Math.min(1, st / 0.1), 1) : (pr.draw || drawSpark)(pr.x + pr.speed * st, air + pr.y + wy, pr.r ?? SPARK_R, st * 14, { t: st, vx: pr.speed, m: move });
  if (move.toss && st >= 0) { const T = move.toss, tb = T.speed / T.decel, u = Math.min(st, 2 * tb); if (st < 2 * tb) drawLegoHead({ x: T.x + T.speed * u - T.decel * u * u / 2, y: air + T.y, rot: st * 22, face: 1 }); } // out and (preview: straight) back
  if (move.builds) drawLegoBooklet(0, air - 84, move.builds.map(k => LEGO_MOVESET.specials[k]), Math.floor(fr / 20) % move.builds.length, Math.min(1, fr / move.open), 45); // Lego Man's pick list (with 45 studs), the pick stepping down
  if (move.fire && st >= 0) { const L = move.fire, v = Math.min(L.speed[1], L.speed[0] + L.accel * st), tt = (v - L.speed[0]) / L.accel; drawLegoRocket({ x: L.x + L.speed[0] * tt + L.accel * tt * tt / 2 + v * (st - tt), y: air + L.y, dir: 1 }); } // flying off (no target to burst on here)
  if (move.scatter && st >= 0) for (let k = 0; k < move.scatter.count; k++) { // loose bricks (uncharged): arc out, land, slide to a stop
    const [vx, vy] = scatterVel(k, 0), g = 2300, tl = (-vy + Math.sqrt(vy * vy + 2 * g * 19)) / g, ts = Math.max(0, Math.min(st - tl, vx / 1800)), t = Math.min(st, tl);
    drawLooseBrick({ x: 14 + vx * t + vx * ts - 900 * ts * ts, y: Math.min(-7, -26 + vy * t + g * t * t / 2), w: 12, h: 7, rot: st < tl ? (8 + 5 * (k % 3)) * st : 0, col: k % 4 });
  }
  if (learn || !$('boxes').checked || !F.hurt) return;
  const rad = pr?.r ?? SPARK_R;
  if (pr && st >= 0) drawRect({ x: pr.x + pr.speed * st - rad, y: air + pr.y + wy - rad, w: 2 * rad, h: 2 * rad }, BOX, 'rgba(224,82,58,0.18)');
  const hurt = F.hurt(pose); hurt.y += air;
  drawRect(hurt, '#c9a227', 'rgba(230,190,60,0.22)');
  if (phaseAt(fr) === 'active' && move.hitbox) { // hitbox is relative to the fighter's bottom-center, facing right
    const hb = typeof move.hitbox === 'function' ? move.hitbox(fr) : move.hitbox; // moving / growing ones: at this frame, full charge
    drawRect({ x: x + hb.x, y: y + hb.y, w: hb.w, h: hb.h }, BOX, 'rgba(224,82,58,0.18)');
    const sw = move.sweet; if (sw) drawRect({ x: x + sw.x, y: y + sw.y, w: sw.w, h: sw.h }, BOX, 'rgba(224,82,58,0.3)'); // the stronger spot inside it
  }
}

function renderBoard() {
  const main = ctx; ctx = bctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(boardPaper, 0, 0);
  const frames = panelFrames(), fi = Math.floor(f), { move, group } = list[cur];
  // fit the move's whole height range (jumps above, drops below the floor) into the panel
  const airs = frames.map(fr => move.anim(fr, total).air || 0);
  const carried = frames.filter(fr => !(fr > move.startup)).map(fr => move.anim(fr, total).carry).filter(Boolean); // a grabbed bag, until a throw lets go: its top, and both sides
  const hi = Math.max((frames.some(fr => move.anim(fr, total).effort != null) ? 130 : 55) - Math.min(0, ...airs), ...carried.map(c => 84 - c[1])), lo = Math.max(0, ...airs); // room for the effort bar overhead
  // …and its sideways travel (rolls, lunges, a carried bag), centring the panel on it
  const xs = [...frames.map(fr => move.anim(fr, total).x || 0), ...carried.flatMap(c => [c[0] - 26, c[0] + 26 - 50])], x0 = Math.min(0, ...xs), x1 = Math.max(0, ...xs);
  const s = Math.min(1.2, (PH - 44) / (hi + lo), (PW - 24) / (x1 - x0 + 100)), floorY = 34 + hi * s, ox = PW / 2 - (x0 + x1) / 2 * s;
  frames.forEach((fr, i) => {
    const now = fi >= fr && (i === frames.length - 1 || fi < frames[i + 1]);
    ctx.setTransform(dpr, 0, 0, dpr, (i % COLS) * PW * dpr, Math.floor(i / COLS) * PH * dpr);
    ctx.lineCap = ctx.lineJoin = 'round';
    ctx.strokeStyle = now ? BOX : INK; ctx.lineWidth = now ? 2.4 : 1.2;
    poly([[6, 6], [PW - 6, 6], [PW - 6, PH - 6], [6, PH - 6]], 0.8);
    ctx.save(); ctx.beginPath(); ctx.rect(7, 7, PW - 14, PH - 14); ctx.clip();
    ctx.strokeStyle = INK; ctx.lineWidth = 1.2; line(group === 'ledge' ? ox - halfBox() * s : 22, floorY, PW - 22, floorY, 0.6, 1);
    ctx.translate(ox, floorY); ctx.scale(s, s); drawFigure(fr); ctx.restore();
    ctx.font = '600 18px Caveat, cursive'; ctx.fillStyle = INK; ctx.textAlign = 'left';
    ctx.fillText(`f${fr + 1}`, 14, 26);
    const ph = phaseAt(fr);
    if (ph) { ctx.fillStyle = ph === 'active' ? BOX : '#857a6a'; ctx.textAlign = 'right'; ctx.fillText(ph, PW - 14, 26); }
  });
  ctx = main;
}
board.onclick = e => {
  const r = board.getBoundingClientRect();
  const fr = panelFrames()[Math.floor((e.clientY - r.top) / r.height * 2) * COLS + Math.floor((e.clientX - r.left) / r.width * COLS)];
  if (fr !== undefined) { step(0); f = fr; }
};

function render(t) {
  seed = Math.floor(t * 8) * 7919 + 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(paper, 0, 0);
  ctx.setTransform(dpr * SCALE, 0, 0, dpr * SCALE, 0, 0);
  ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = INK;

  // little floor; for ledge moves it stops at the lip Claw'd hangs from (x = 0 stands him half his box in from it, as in the game)
  const { move, group } = list[cur], lip = group === 'ledge' ? VW / 2 - halfBox() : null;
  hatch([[lip ?? 100, GROUND], [380, GROUND], [365, GROUND + 20], [lip ?? 115, GROUND + 20]], 8, 0.3);
  ctx.lineWidth = 2; line(lip ?? 92, GROUND, 388, GROUND, 1.2);

  ctx.save(); ctx.translate(VW / 2, GROUND);
  if (bag) drawBag(Math.floor(f));
  drawFigure(Math.min(Math.floor(f), total - 1));
  if (bag) drawPow(Math.floor(f));
  ctx.restore();

  if (!move.anim) {
    ctx.save(); ctx.translate(VW / 2, 70); ctx.rotate(-0.05);
    ctx.fillStyle = BOX; ctx.globalAlpha = 0.85; ctx.textAlign = 'center';
    ctx.font = '700 30px Caveat, cursive'; ctx.fillText('no animation yet', 0, 0);
    ctx.strokeStyle = BOX; ctx.lineWidth = 2; line(-95, 10, 95, 7, 1.5, 1);
    ctx.restore();
  }

  if (move.anim && !learn) renderBoard();
  $('head').style.left = (f / total * 100) + '%';
  $('frame').textContent = `frame ${Math.floor(f) + 1} / ${total}`;
}

function step(d) { playing = false; $('play').textContent = 'play'; f = ((Math.floor(f) + d) % total + total) % total; }
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'pause' : 'play'; };
$('prev').onclick = () => step(-1);
$('boxes').onchange = e => e.target.blur(); // keep Space/H shortcuts from also hitting the focused checkbox
$('next').onclick = () => step(1);
$('back').onclick = () => select(cur - 1);
$('fwd').onclick = () => select(cur + 1);
function setMode(on) { // learn ⇄ advanced, staying on the same move when the new list has it
  learn = on; document.body.classList.toggle('learn', on); $(on ? 'stage' : 'slot').append(cv);
  $('learnBtn').setAttribute('aria-pressed', on); $('storyBtn').setAttribute('aria-pressed', !on);
  const key = list[cur]?.key; pick(fid); select(Math.max(0, list.findIndex(it => it.key === key)));
}
$('slow').onclick = () => { const slow = $('speed').value === '1'; $('speed').value = slow ? '0.25' : '1'; $('slow').textContent = slow ? 'normal speed' : 'slow-mo'; $('slow').blur(); };
$('learnBtn').onclick = () => setMode(true);
$('storyBtn').onclick = () => setMode(false);
addEventListener('keydown', e => {
  if (!$('whoList').hidden) { // the character list is open: ↑↓ pick, Enter / Space choose, Esc close
    const k = { ArrowUp: () => { hi = (hi + IDS.length - 1) % IDS.length; highlight(); }, ArrowDown: () => { hi = (hi + 1) % IDS.length; highlight(); },
      Enter: () => choose(IDS[hi]), Space: () => choose(IDS[hi]), Escape: () => openList(false) }[e.code];
    if (k) { e.preventDefault(); k(); }
    return;
  }
  if (e.code === 'Escape') return void $('exit').click(); // leave for the game's home screen
  const act = learn ? { ArrowLeft: () => cur && select(cur - 1), ArrowUp: () => cur && select(cur - 1), ArrowRight: () => select(cur + 1), ArrowDown: () => select(cur + 1), Space: () => $('play').click() }
    : { ArrowUp: () => select(cur - 1), ArrowDown: () => select(cur + 1), ArrowLeft: () => step(-1), ArrowRight: () => step(1), Space: () => $('play').click(), KeyH: () => $('boxes').click() }[e.code];
  if (act) { e.preventDefault(); act(); }
});

let last = performance.now();
function frame(now) {
  if (playing) f = (f + (now - last) / 1000 * 60 * +$('speed').value) % (total + hold);
  last = now;
  render(now / 1000);
  requestAnimationFrame(frame);
}
const [who, at] = location.hash.slice(1).includes('/') ? location.hash.slice(1).split('/') : ['clawd', location.hash.slice(1)]; // #fighter/move (a bare #move is Claw'd's)
fid = FIGHTERS[who] ? who : 'clawd'; list = [{ key: at }]; setMode(learn);
requestAnimationFrame(frame);
</script>
